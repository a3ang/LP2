# 3D FRONT Scene Configuration Template
# Copy and modify this file for your 3D FRONT scenes

data:
  # Path to scene graph JSON file (Spark-DSG format)
  scene_graph_path: data/3dfront/SCENE_NAME/SCENE_ID_scene_graph.json

  # Path to room labels JSON file
  room_labels_path: data/3dfront/SCENE_NAME/SCENE_ID_room_labels.json

  # Directory containing trajectory CSV files
  trajectory_dir: data/3dfront/SCENE_NAME/trajectories

  # Optional: Occupancy map for visualization
  # occupancy_map: data/3dfront/SCENE_NAME/occupancy_map/oracle.png
  # homography: data/3dfront/SCENE_NAME/occupancy_map/SCENE_ID_H.txt

# Optional: Animation configuration
# animation:
#   bg_cfg: data/3dfront/SCENE_NAME/animation/config.yaml
#   visualize_bg: True

global:
  # Scene identifier (used in output directories)
  scene: 3dfront_SCENE_NAME

  # Environment bounds [[x_min, y_min], [x_max, y_max]]
  # Use scripts/compute_scene_bounds.py to calculate automatically
  environment_bounds: [[-10.0, -10.0], [10.0, 10.0]]

  # Bandwidth for kernel density estimation
  # Larger values = smoother probability distributions
  # Typical range: 0.5 - 1.5
  bandwidth: 0.8
